# iOS without a Mac or an iPhone (ios-plan/IOS-PLAN.md):
#   core-apple  Nexus.xcframework from the patched core (core/scripts/build-apple.sh)
#   b03         bench/B-03 host proxy: the patched core's memory under load on macOS arm64, with the
#               extension's runtime policy. An estimate until a device run replaces it (bench/B-03)
#   ios-app     the app and the packet-tunnel extension (clients/web/ios/App/project.yml), built
#               UNSIGNED - proof that everything compiles before an Apple account or a phone exists
# Manual or on pushes to ios/** branches only. Nothing here signs, uploads to Apple or publishes.
#
# Logs and step summaries need a signed-in viewer; check-run annotations do not. Failures put
# their log tail into one error annotation (newlines escaped as %0A).
name: ios-phase1

on:
  workflow_dispatch:
  push:
    branches: ['ios/**']

permissions:
  contents: read

env:
  TAGS: with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api
  GOMOBILE: v0.0.0-20260908204917-8b95e45f8d3e   # the golang.org/x/mobile version core/go.mod pins

jobs:
  core-apple:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - name: Patched sing-box
        run: bash core/scripts/prepare-sing-box.sh
      - name: gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@$GOMOBILE
          go install golang.org/x/mobile/cmd/gobind@$GOMOBILE
          gomobile init
      - name: Build Nexus.xcframework
        working-directory: core
        run: |
          set -o pipefail
          bash ./scripts/build-apple.sh 2>&1 | tee "$RUNNER_TEMP/build-apple.log"
      - name: Framework report
        working-directory: core
        run: |
          {
            echo "## Nexus.xcframework"; echo '```'
            du -sh build/apple/Nexus.xcframework build/apple/Nexus.xcframework/*
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The generated Objective-C headers are the Swift side's API; keep them reviewable.
          find build/apple/Nexus.xcframework -path '*ios-arm64/*' -name '*.h' | head -20
          echo "::notice title=xcframework size::$(du -sh build/apple/Nexus.xcframework | cut -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: Nexus.xcframework
          path: core/build/apple/Nexus.xcframework
          retention-days: 7
      - name: Failure tail
        if: failure()
        run: |
          f="$RUNNER_TEMP/build-apple.log"; [ -f "$f" ] || exit 0
          tail="$(tail -n 60 "$f" | tr -d '\r' | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
          echo "::error title=build-apple.log tail::${tail}"

  b03:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - name: Patched sing-box
        run: bash core/scripts/prepare-sing-box.sh
      - name: Xray 26.9.9 (the B-03 server)
        run: GOBIN="$RUNNER_TEMP/xray" go install github.com/xtls/xray-core/main@v1.260327.1-0.20260908222543-52a412d9e2f5
      - name: B-03 host proxy (macOS arm64)
        working-directory: core
        env:
          NEXUS_XRAY_BIN: ${{ runner.temp }}/xray/main
          B03_OUT: ${{ github.workspace }}/bench/runs/ci-B-03-macos
          B03_CYCLES: '3'
        run: |
          set -o pipefail
          go test -count=1 -tags "$TAGS,nexus_bench" -ldflags=-checklinkname=0 ./nexuscore/ -run '^TestB03Memory$' -v -timeout 0 2>&1 | tee "$RUNNER_TEMP/b03.log"
          cat "$B03_OUT/result.md" >> "$GITHUB_STEP_SUMMARY"
          # The result table, public as annotations (one per arm row).
          grep '^| ' "$B03_OUT/result.md" | tail -n +2 | while read -r row; do echo "::notice title=B-03 host proxy::$row"; done
      - uses: actions/upload-artifact@v4
        with:
          name: b03-macos
          path: bench/runs/ci-B-03-macos
      - name: Failure tail
        if: failure()
        run: |
          f="$RUNNER_TEMP/b03.log"; [ -f "$f" ] || exit 0
          tail="$(tail -n 60 "$f" | tr -d '\r' | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
          echo "::error title=b03.log tail::${tail}"

  ios-app:
    needs: core-apple
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Nexus.xcframework
          path: core/build/apple/Nexus.xcframework
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - name: Web build
        working-directory: clients/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: XcodeGen
        run: brew install xcodegen
      # Order: cap copy first (App/public, capacitor.config.json and config.xml must exist when
      # XcodeGen lists the app's resources), then XcodeGen, then cap sync (it reads the
      # deployment target from App.xcodeproj and rewrites CapApp-SPM/Package.swift).
      - name: Generate Nexus.xcodeproj and sync Capacitor
        working-directory: clients/web
        run: |
          set -o pipefail
          {
            npx cap copy ios
            (cd ios/App && xcodegen generate)
            npx cap sync ios
          } 2>&1 | tee "$RUNNER_TEMP/generate.log"
      - name: Build (unsigned)
        working-directory: clients/web/ios/App
        run: |
          set -o pipefail
          xcodebuild -project Nexus.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) NEXUS_B03' \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E 'error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)' | head -200
      - name: App report
        run: |
          app=$(find "$RUNNER_TEMP/dd/Build/Products" -name 'App.app' -maxdepth 3 | head -1)
          echo "::notice title=App.app::$(du -sh "$app" | cut -f1); extension: $(du -sh "$app/PlugIns/PacketTunnel.appex" | cut -f1)"
      # The app launched in the iOS Simulator, so a crash at launch or a broken plugin bridge
      # shows up before the borrowed-phone session. Not the tunnel: NetworkExtension does not
      # run in the Simulator. Debug, so Capacitor logs the bridge and the web console.
      # Signed to run locally ("-"): the Simulator then applies the entitlements, including the
      # App Group that Shared/AppGroup.swift requires.
      - name: Build for the Simulator (Debug)
        working-directory: clients/web/ios/App
        run: |
          set -o pipefail
          xcodebuild -project Nexus.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd-sim" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/sim-build.log" | grep -E 'error:|BUILD (SUCCEEDED|FAILED)' | head -100
      - name: Simulator launch smoke test
        run: |
          out="$RUNNER_TEMP/sim"; mkdir -p "$out"
          app="$RUNNER_TEMP/dd-sim/Build/Products/Debug-iphonesimulator/App.app"
          udid=$(xcrun simctl list devices available | grep -E '^ +iPhone' | head -1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "simulator: $(xcrun simctl list devices available | grep "$udid" | sed 's/^ *//')"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b > /dev/null
          xcrun simctl install "$udid" "$app"
          # NSUnbufferedIO: print() reaches the pipe at once, as when Xcode runs the app.
          SIMCTL_CHILD_NSUnbufferedIO=YES xcrun simctl launch --console "$udid" io.nexus.app > "$out/console.log" 2>&1 &
          sleep 30
          xcrun simctl io "$udid" screenshot "$out/launch.png" || true
          pid=$(xcrun simctl spawn "$udid" launchctl list | awk '/UIKitApplication:io\.nexus\.app/ {print $1}' | head -1)
          crashes=$(ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -E '^App[-_.].*\.ips$' | tr '\n' ' ')
          calls="$(grep -aoE 'To Native -> +[A-Za-z]+ +[A-Za-z]+' "$out/console.log" | awk '{print $(NF-1)"."$NF}' | sort | uniq -c | awk '{printf "%s x%s, ", $2, $1}')"
          echo "::notice title=Plugin calls (first 30 s)::${calls:-none}"
          lines="$(grep -aE '⚡|\[nexus\]|rror|atal' "$out/console.log" | grep -av 'To Native ->' | head -n 80 | tr -d '\r' | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
          echo "::notice title=Simulator console::${lines:-empty}"
          xcrun simctl terminate "$udid" io.nexus.app || true
          kill %1 2>/dev/null || true
          if [ -z "$pid" ] || [ "$pid" = "-" ] || [ -n "$crashes" ]; then
            echo "::error title=Simulator launch::not running 30 s after launch (pid '${pid:-none}'; crash reports: ${crashes:-none})"
            exit 1
          fi
          echo "::notice title=Simulator launch::running 30 s after launch, no crash report"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-launch
          path: ${{ runner.temp }}/sim
          retention-days: 7
          if-no-files-found: ignore
      - name: Failure tail
        if: failure()
        run: |
          g="$RUNNER_TEMP/generate.log"
          if [ -f "$g" ] && [ ! -f "$RUNNER_TEMP/xcodebuild.log" ]; then
            tail="$(tail -n 40 "$g" | tr -d '\r' | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
            echo "::error title=generate tail::${tail}"
          fi
          for f in "$RUNNER_TEMP/xcodebuild.log" "$RUNNER_TEMP/sim-build.log"; do
            [ -f "$f" ] || continue
            grep -q 'BUILD SUCCEEDED' "$f" && continue
            name=$(basename "$f" .log)
            errs="$(grep -E 'error:' "$f" | sort -u | head -n 60 | tr -d '\r' | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
            echo "::error title=${name} errors::${errs}"
            tail="$(tail -n 40 "$f" | tr -d '\r' | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
            echo "::error title=${name} tail::${tail}"
          done
