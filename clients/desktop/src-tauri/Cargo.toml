[package]
name = "nexus-desktop"
version = "1.3.4"
description = "Nexus desktop shell (ADR-0003 Phase 4): window, tray, and an opaque forwarder to nexusd"
authors = ["the Nexus contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/similook/nexus"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "nexus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-log = "2"
# Official plugin; "2" deliberately - crates.io's newest is a 3.0 alpha, like tauri itself.
tauri-plugin-single-instance = "2"
# Native HTTP for subscription URLs (shared/src/platform.ts: "the Tauri HTTP plugin on
# desktop"): no CORS, no mixed-content block on http://. Default features only. `unsafe-headers`
# is not needed - User-Agent is not on the plugin's forbidden list - and `dangerous-settings`
# stays off, so nothing in the page can switch certificate validation off.
# "~2.6", not "2": the crate must stay on the same minor as @tauri-apps/plugin-http (npm has no
# 2.7 yet), or `tauri build` refuses the pair. 2.7 only adds the opt-in `scopeRedirects`, which
# this app's scope - any http(s) URL - makes moot.
tauri-plugin-http = "~2.6"

# AF_UNIX client for Windows: nexusd listens on an AF_UNIX socket on every OS (ADR-0003 §6.2,
# decision 2), and std only has UnixStream on unix. Phase 6 moves Windows to a named pipe.
[target.'cfg(windows)'.dependencies]
uds_windows = "1"
# Device network status (src/network.rs): Windows' own connectivity verdict (WinRT
# NetworkInformation) and each adapter's HardwareInterface flag. Not a new crate - tauri, tao and
# wry already build windows 0.61 - this only enables the modules network.rs calls.
# src/daemon.rs adds the elevation prompt (ShellExecuteExW "runas", whose struct needs
# System_Registry for one field), COM for the thread that calls it, and a wait on the process.
windows = { version = "0.61", features = [
    "Networking_Connectivity",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
