apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

/**
 * Release signing, read from a file that is NOT in version control.
 *
 * keystore.properties holds the passwords to the key that identifies this app to Google Play
 * forever. Committing it hands anyone with repo access the ability to publish an update, and
 * losing it means the app can never be updated again under the same listing - back it up
 * somewhere other than this machine.
 *
 * Absent file = release builds fall back to unsigned. That is deliberate: a missing keystore
 * should fail at `apk install` with a clear signature error, not silently produce a release
 * signed with the debug key, which cannot be published and looks identical in the output dir.
 *
 * Create it with:
 *   keytool -genkeypair -v -keystore nexus-release.jks -alias nexus -keyalg RSA -keysize 4096 -validity 10000
 */
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

/**
 * One credential, from the file if present, otherwise from the environment.
 *
 * The file is for a developer machine; the environment is for CI, where writing secrets to disk
 * to read them back is a step that can be skipped. Neither is committed - .gitignore covers
 * keystore.properties, and an env var leaves no file at all.
 */
def signingValue = { String key, String env ->
    // Blank counts as absent. A key left in the file with nothing after the `=` - which is what
    // a half-filled copy of keystore.properties.example looks like - would otherwise satisfy
    // containsKey() and be handed to the signer as an empty password.
    def fromFile = keystoreProperties[key]
    fromFile?.trim() ? fromFile.trim() : System.getenv(env)
}

/**
 * True only when EVERY credential is available.
 *
 * All four or none. A partial set would build an APK signed with whatever Gradle could piece
 * together, or fail deep inside the signing task with a message about a null password - both
 * worse than the documented fallback of producing an unsigned APK that fails loudly at install.
 */
def signingReady = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { key ->
    def env = 'NEXUS_' + key.replaceAll(/([A-Z])/, '_$1').toUpperCase()
    signingValue(key, env)?.trim()
}

android {
    namespace "io.nexus.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.nexus.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /*
     * EXPLICIT, because AGP 8 turned this off by default.
     *
     * Without it no BuildConfig class is generated at all - not merely a missing DEBUG field,
     * the whole class is absent - and every `BuildConfig.DEBUG` reference fails to resolve.
     * NexusLog gates on it, so this is a prerequisite rather than a preference.
     */
    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            if (signingReady) {
                storeFile rootProject.file(signingValue('storeFile', 'NEXUS_STORE_FILE'))
                storePassword signingValue('storePassword', 'NEXUS_STORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'NEXUS_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'NEXUS_KEY_PASSWORD')

                /*
                 * The release keystore is PKCS#12, not JKS - verified from its header, which
                 * begins 3082 (DER) rather than feedfeed. Java 9+ defaults to PKCS12 so this
                 * is usually inferred, but stating it means the build does not depend on the
                 * JDK's default changing underneath it.
                 */
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        release {
            /*
             * minifyEnabled STAYS FALSE, and this is not laziness.
             *
             * The Go core is reached through gomobile-generated JNI bindings, and every one of
             * those classes is looked up BY NAME from native code that R8 cannot see. R8 would
             * strip or rename them, and the failure is not a build error - it is a
             * ClassNotFoundException at connect time, in release only, on a user's phone.
             *
             * Enabling it needs keep rules for io.nexus.libbox.**, go.**, and every
             * PlatformInterface implementation, plus a release-build smoke test on device.
             * That is a reviewed change, not a checkbox.
             */
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            signingConfig signingReady ? signingConfigs.release : null
        }
        debug {
            /*
             * NO applicationIdSuffix, deliberately.
             *
             * Suffixing the debug id lets a debug and a release build coexist, which is
             * genuinely useful - but it also means `adb install -r` of a debug APK installs a
             * SECOND app beside the existing one rather than upgrading it. Two Nexus icons in
             * the launcher already cost this project an evening of debugging once, and
             * reintroducing that to save an uninstall is the wrong trade.
             *
             * To test a release candidate beside the debug build, add the suffix temporarily.
             */
            versionNameSuffix '-debug'
        }
    }

    /*
     * The AAR carries arm64-v8a only (core/scripts/build-android.sh targets android/arm64), so
     * the APK must not claim to support anything else - a 32-bit device would install it and
     * then crash on the first JNI call with UnsatisfiedLinkError.
     */
    splits {
        abi {
            enable false
        }
    }

}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    // '*.aar' added: Capacitor's generated fileTree covers *.jar only, so nexus.aar would be
    // silently ignored and every io.nexus.libbox.* import would fail to resolve.
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')

    // core-ktx supplies ContextCompat.registerReceiver (the API 33+ exported flag) and
    // ServiceCompat.startForeground (the 3-arg form carrying the foreground-service type).
    // Both are load-bearing in NexusVpnService/PowerReceiver/TunnelNotification.
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.activity:activity-ktx:$androidxActivityVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
