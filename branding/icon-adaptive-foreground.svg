<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#080E1D"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Subtle Radial Glow in Center -->
    <radialGradient id="centerGlow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="#FF5100" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Orange Gradient for Central X and Paths -->
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA439"/>
      <stop offset="50%" stop-color="#FF6600"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Secondary Node Gradient -->
    <linearGradient id="nodeGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFDD80"/>
      <stop offset="40%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <!-- Inner Core Gradient -->
    <radialGradient id="coreLight" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FFD6A5"/>
      <stop offset="70%" stop-color="#FF6600"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </radialGradient>

    <!-- Text Glow Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="70%" stop-color="#FF8800"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1"/>
      <feGaussianBlur stdDeviation="5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" result="bigGlow"/>
      <feMerge>
        <feMergeNode in="bigGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Border highlight -->
    <linearGradient id="squircleStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FF6600" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="150" fill="url(#centerGlow)"/>
  <g opacity="0.10" stroke="#FF8A00" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4 8">
    <circle cx="256" cy="258" r="124" fill="none"/>
  </g>
<g transform="translate(256, 266) scale(0.84) translate(-256, -256)">
    <!-- Connection Links (Glow Underlayer) -->
    <g filter="url(#intenseGlow)" opacity="0.65" stroke="#FF5500" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
      <line x1="160" y1="160" x2="352" y2="352"/>
      <line x1="352" y1="160" x2="160" y2="352"/>
      <path d="M 256 128 L 368 322 L 144 322 Z" fill="none" stroke-width="12" stroke="#FF7700" opacity="0.4"/>
    </g>

    <!-- Crisp Modern Geometric 'X' Nexus Shapes -->
    <g filter="url(#neonBlur)">
      <line x1="160" y1="160" x2="352" y2="352" stroke="url(#orangeGlow)" stroke-width="20" stroke-linecap="round"/>
      <line x1="352" y1="160" x2="160" y2="352" stroke="url(#orangeGlow)" stroke-width="20" stroke-linecap="round"/>
      <path d="M 256 135 L 360 315 L 152 315 Z" fill="none" stroke="url(#orangeGlow)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
      <path d="M 256 377 L 152 197 L 360 197 Z" fill="none" stroke="#FFA439" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
    </g>

    <!-- Nodes -->
    <!-- Top Node -->
    <g filter="url(#neonBlur)">
      <circle cx="256" cy="135" r="28" fill="#080E1D" stroke="url(#orangeGlow)" stroke-width="5"/>
      <circle cx="256" cy="135" r="14" fill="url(#coreLight)"/>
    </g>

    <!-- Bottom-Left Node -->
    <g filter="url(#neonBlur)">
      <circle cx="152" cy="315" r="28" fill="#080E1D" stroke="url(#orangeGlow)" stroke-width="5"/>
      <circle cx="152" cy="315" r="14" fill="url(#coreLight)"/>
    </g>

    <!-- Bottom-Right Node -->
    <g filter="url(#neonBlur)">
      <circle cx="360" cy="315" r="28" fill="#080E1D" stroke="url(#orangeGlow)" stroke-width="5"/>
      <circle cx="360" cy="315" r="14" fill="url(#coreLight)"/>
    </g>

    <!-- Outer Nodes -->
    <circle cx="160" cy="160" r="15" fill="url(#orangeGlow)" opacity="0.9"/>
    <circle cx="160" cy="160" r="6" fill="#FFF"/>

    <circle cx="352" cy="160" r="15" fill="url(#orangeGlow)" opacity="0.9"/>
    <circle cx="352" cy="160" r="6" fill="#FFF"/>

    <circle cx="256" cy="370" r="12" fill="url(#orangeGlow)" opacity="0.6"/>

    <!-- Central Nexus Core -->
    <g filter="url(#intenseGlow)">
      <circle cx="256" cy="256" r="32" fill="url(#nodeGrad)"/>
      <circle cx="256" cy="256" r="20" fill="#FFFFFF"/>
      <circle cx="256" cy="256" r="42" fill="none" stroke="#FFA439" stroke-width="2.5" stroke-dasharray="5 3.5" opacity="0.8"/>
    </g>
  </g>
</svg>